<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Bread</title>
<meta name="description" content="A calm, phone first Bible reader: today's verse, continue where you left off, and three short collections.">
<meta name="theme-color" content="#FBF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Bread">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{
  --paper:#FBF8F1; --card:#FFFFFF; --ink:#1E2220; --muted:#6E6960; --rule:#E3DDD0;
  --accent:#3E6B4C; --accent-ink:#FFFFFF; --soft:#E9F0EA; --mark:#FFF1C2;
  --shadow:0 1px 2px rgba(30,34,32,.06),0 8px 24px rgba(30,34,32,.06);
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --display:'Fraunces',Georgia,serif;
  --ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --size:19px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141716; --card:#1C201E; --ink:#E6E1D6; --muted:#9A948A; --rule:#2B302D;
    --accent:#8CC39A; --accent-ink:#0F1A13; --soft:#1E2A22; --mark:#3D3A22;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141716; --card:#1C201E; --ink:#E6E1D6; --muted:#9A948A; --rule:#2B302D;
  --accent:#8CC39A; --accent-ink:#0F1A13; --soft:#1E2A22; --mark:#3D3A22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.screen{display:none;min-height:100%;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
.screen.on{display:block}
.wrap{max-width:640px;margin:0 auto}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--rule);margin-bottom:8px}
.bar .grow{flex:1;min-width:0}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink)}
.icon-btn:active{background:var(--soft)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:600;font-size:15px;max-width:100%}
.chip.big{font-family:var(--display);font-size:17px;font-weight:600;padding:9px 16px}

/* home */
.greet{padding:calc(20px + env(safe-area-inset-top,0px)) 0 4px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.15;margin:4px 0 18px;text-wrap:balance}
.today{background:var(--card);border-radius:20px;padding:22px 22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.today .verse{font-family:var(--display);font-size:24px;line-height:1.35;margin:10px 0 12px;text-wrap:pretty}
.today .ref{color:var(--muted);font-size:15px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn:active{filter:brightness(.92)}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.tile .num{font-family:var(--display);font-size:26px;color:var(--accent);min-width:34px;text-align:center}
.tile .t{font-weight:600;font-size:17px}
.tile .s{color:var(--muted);font-size:14px;margin-top:2px}
.tile .go{margin-left:auto;color:var(--muted)}
.tile .go svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.progress{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.section{margin:26px 0 10px}
.section h2{font-family:var(--display);font-weight:600;font-size:22px;margin:4px 0 12px}
.stat{font-size:13px;color:var(--muted);margin-top:18px;text-align:center}

/* reader */
.reading{font-family:var(--serif);font-size:var(--size);line-height:1.65;padding:6px 0 10px;max-width:38em;margin:0 auto}
.reading h2{font-family:var(--display);font-weight:600;font-size:1.7em;line-height:1.1;margin:.5em 0 .6em}
.v{display:block;margin:0 0 .55em;padding:2px 6px;border-radius:8px;scroll-margin-top:90px}
.v sup{font-family:var(--ui);font-size:.62em;color:var(--accent);font-weight:600;margin-right:.35em;vertical-align:baseline;position:relative;top:-.45em}
.v.hl{background:var(--mark)}
.nav{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.nav .btn{flex:1}
.nav .btn.ghost:disabled{opacity:.35}

/* picker */
.tabs{display:flex;gap:6px;padding:4px;background:var(--soft);border-radius:14px;margin:6px 0 14px}
.tabs button{flex:1;padding:10px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{background:var(--card);border-radius:12px;padding:12px 4px;min-height:56px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.grid button b{font-family:var(--display);font-size:17px;font-weight:600}
.grid button small{color:var(--muted);font-size:11px;line-height:1.1;text-align:center}
.grid button.done{background:var(--soft);color:var(--accent)}
.grid.chapters{grid-template-columns:repeat(6,1fr)}
.grid.chapters button{min-height:48px;padding:0}
.grid.chapters button b{font-family:var(--ui);font-size:16px}
.pick-title{font-family:var(--display);font-size:24px;font-weight:600;margin:6px 0 12px}

/* collection */
.card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.card .ref{font-weight:600;color:var(--accent);font-size:14px;margin-bottom:6px;font-family:var(--ui)}
.card .txt{font-family:var(--serif);font-size:17px;line-height:1.55}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:21;display:none;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet.on{display:block}
.sheet h3{margin:0 0 12px;font-family:var(--display);font-size:20px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.aa{display:inline-flex;gap:4px}
.aa button{width:44px;height:40px;border-radius:10px;background:var(--soft);font-weight:600}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="home" class="screen">
  <div class="wrap">
    <div class="greet">
      <div class="eyebrow" id="dateLine"></div>
      <h1 id="greeting">Good morning</h1>
    </div>
    <div class="today">
      <div class="eyebrow">Today's verse</div>
      <div class="verse" id="todayText">Loading the Bible for the first time…</div>
      <div class="ref" id="todayRef"></div>
      <button class="btn" id="todayGo">Read the chapter</button>
    </div>
    <button class="tile" id="continueTile">
      <div class="grow" style="flex:1;min-width:0">
        <div class="eyebrow" id="continueLabel">Continue reading</div>
        <div class="t" id="continueTitle">John 1</div>
        <div class="progress"><i id="continueBar"></i></div>
      </div>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
    <button class="tile" id="browseTile">
      <div class="num">66</div>
      <div><div class="t">All books</div><div class="s">Genesis to Revelation</div></div>
      <span class="go"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </button>
    <div class="section"><h2>Collections</h2><div id="collections"></div></div>
    <div class="stat" id="stat"></div>
  </div>
</section>

<section id="read" class="screen">
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" id="readHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
      <div class="grow"><button class="chip big" id="readTitle">John 1</button></div>
      <button class="icon-btn" id="readAa" aria-label="Text settings"><svg viewBox="0 0 24 24"><path d="M4 18L10 5l6 13M6.5 13h7"/><path d="M17 11l2 7 2-7"/></svg></button>
    </div>
    <div class="reading" id="readBody"></div>
    <div class="nav">
      <button class="btn ghost" id="prevCh">← Previous</button>
      <button class="btn" id="nextCh">Next →</button>
    </div>
  </div>
</section>

<section id="books" class="screen">
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" id="booksBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="grow pick-title" style="margin:0">Books</div>
    </div>
    <div class="tabs"><button id="tabOT" class="on">Old Testament</button><button id="tabNT">New Testament</button></div>
    <div class="grid" id="bookGrid"></div>
  </div>
</section>

<section id="chapters" class="screen">
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" id="chBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="grow pick-title" style="margin:0" id="chTitle">Genesis</div>
    </div>
    <div class="grid chapters" id="chGrid"></div>
  </div>
</section>

<section id="collection" class="screen">
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" id="colBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div class="grow pick-title" style="margin:0" id="colTitle"></div>
    </div>
    <p id="colSub" style="color:var(--muted);margin:0 0 14px"></p>
    <div id="colList"></div>
  </div>
</section>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>Reading</h3>
  <div class="row"><span>Text size</span><span class="aa"><button id="sizeDown" aria-label="Smaller">A−</button><button id="sizeUp" aria-label="Larger">A+</button></span></div>
  <div class="row"><span>Translation</span><span class="seg"><button data-tr="web">WEB</button><button data-tr="kjv">KJV</button></span></div>
  <div class="row"><span>Theme</span><span class="seg"><button data-theme="auto">Auto</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button></span></div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
